<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Contactos</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>

  <div class="container mt-5">
    <h1 class="text-center mb-4"> Lista de Contactos</h1>

    
    <div class="card p-4 mb-4">
      <h4 id="form-titulo">Agregar Contacto</h4>
      <form id="form-contacto">
        <input type="hidden" id="contacto-id">

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nombre *</label>
            <input type="text" class="form-control" id="nombre" placeholder="Nombre completo">
          </div>
          <div class="col-md-6">
            <label class="form-label">Email *</label>
            <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com">
          </div>
          <div class="col-md-6">
            <label class="form-label">Teléfono *</label>
            <input type="tel" class="form-control" id="telefono" placeholder="+54 261 000-0000">
          </div>
          <div class="col-md-6">
            <label class="form-label">Fecha de nacimiento *</label>
            <input type="date" class="form-control" id="fecha">
          </div>
          <div class="col-md-12">
            <label class="form-label">Imagen (URL) </label>
            <input type="text" class="form-control" id="imagen" placeholder="https://...">
          </div>
        </div>

        <div class="mt-3 d-flex gap-2">
          <button type="submit" class="btn btn-primary" id="btn-guardar">Guardar contacto</button>
          <button type="button" class="btn btn-secondary" id="btn-cancelar" style="display:none">Cancelar</button>
        </div>
      </form>
    </div>

    
    <div class="card p-4">
      <h4>Contactos</h4>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>Foto</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th>Nacimiento</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-contactos">
            
          </tbody>
        </table>
      </div>
    </div>
  </div>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
